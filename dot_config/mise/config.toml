[tools]

# languages
java = "temurin-25"
go = "1.27"
bun = "1"
python = "3.15"
node = "lts"
rust = "stable"
zig = "0.17"
terraform = "1"

# node packages, installed via mise's embedded npm installer
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:markdownlint-cli" = "latest"

# go packages, built with `go install` against the active go
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/cmd/gonew" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
"go:github.com/spf13/cobra-cli" = "latest"
"go:github.com/dineshba/tf-summarize" = "latest"
"go:github.com/joakimen/awsvault" = "latest"


# tools
trivy = "latest"
tflint = "latest"
task = "latest"
terraform-docs = "latest"
ruff = "latest"
fnox = "latest"
age = "latest"
supabase = "latest"
prek = "latest"
herdr = "latest"
"github:bahdotsh/mdterm" = "latest"
acli = "latest"
checkmake = "latest"
maven = "latest"
shellcheck = "latest"
shfmt = "latest"

[settings]
status.show_tools = true             # prints which tools changed when you cd into a project
use_versions_host_track = false      # opt out of install telemetry sent to mise-versions
disable_backends = ["asdf"]
# lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"] ##  currently only used by global cfg
tool_update.global_auto = true
idiomatic_version_file_enable_tools = ["bun", "node", "python"]
minimum_release_age = "3d"
minimum_release_age_excludes = ["github:joakimen/cid","github:joakimen/rw", "github:joakimen/awsvault"]

# trust personal and work project toolchains
trusted_config_paths = [
    '~/dev/github.com/joakimen',
    '~/dev/github.com/joakimen-test-org',
    '~/dev/github.com/capralifecycle',
    '~/dev/github.com/capraconsulting',
    '~/dev/github.com/grotsetgilfil',
]

python.uv_venv_auto = "source"       # activates an existing .venv in uv projects

[settings.github]
credential_command="gh auth token"

# verbose = false     # Show extra output for debugging
# experimental = false    # enable experimental features
